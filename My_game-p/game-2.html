<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="stylesheet" href="./game.css" />

  <body>
    <header>
      <h1>Game Design</h1>
      <nav>
        <ul>
          <li><a href="./Game-Portfolio.html">Home</a></li>
          <li><a href="#modeling">Works</a></li>
          <li>

        </ul>

    <main>
      <section class="hero" id="home">

          <div class="portfolio-card">

            <div class="thumbnail">Work 3</div>
            <h3>Weapon Asset</h3>
          </div>
          <div class="portfolio-card" id="mori-link">

    <footer>
      <p>&copy; 2026 My Game Portfolio. All rights reserved.</p>

    <!-- 모달 창 구조 -->

      <span class="close-modal">&times;</span>
      <div class="modal-content" id="modal-image-placeholder"></div>
      <div id="modal-caption"></div>
    </div>

    <!-- 퀵 내비게이션 -->
    <div class="quick-nav">
