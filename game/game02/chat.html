<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>실시간 멀티 채팅방</title>
    <style>
      body {
        margin: 0;
        padding-bottom: 4rem;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f0f2f5;
      }
      h1 {
        text-align: center;
        color: #333;
        margin: 20px 0;
        font-size: 1.5rem;
      }
      #messages {
        list-style-type: none;
        margin: 0;
        padding: 0;
      }
      #messages > li {
        padding: 12px 20px;
        border-bottom: 1px solid #e4e6eb;
      }
      #messages > li:nth-child(odd) {
        background: #fff;
      }
      #messages > li:nth-child(even) {
        background: #f9f9f9;
      }
      #form {
        background: #fff;
        padding: 10px;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        height: 60px;
        box-sizing: border-box;
        box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
      }
      #input {
        border: 1px solid #ccc;
        padding: 0 1rem;
        flex-grow: 1;
        border-radius: 2rem;
        margin-right: 10px;
        font-size: 1rem;
        outline: none;
      }
      #input:focus {
        border-color: #0084ff;
      }
      #form > button {
        background: #0084ff;
        border: none;
        padding: 0 1.5rem;
        border-radius: 2rem;
        color: #fff;
        cursor: pointer;
        font-size: 1rem;
        font-weight: bold;
        transition: background 0.2s;
      }
      #form > button:hover {
        background: #0073e6;
      }
    </style>
  </head>
  <body>
    <h1>💬 실시간 멀티 채팅방</h1>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input
        id="input"
        autocomplete="off"
        placeholder="메시지를 입력하세요..."
        required
      />
      <button>전송</button>
    </form>

    <!-- Socket.io 클라이언트 라이브러리 (서버에서 자동 제공) -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");

      // 1. 폼(메시지) 제출 시 서버로 'chat message' 이벤트 전송
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (input.value) {
          socket.emit("chat message", input.value);
          input.value = "";
        }
      });

      // 2. 서버로부터 'chat message' 이벤트 수신 시 화면에 추가
      socket.on("chat message", (msg) => {
        const item = document.createElement("li");
        item.textContent = msg;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight); // 스크롤 맨 아래로
      });
    </script>
  </body>
</html>
