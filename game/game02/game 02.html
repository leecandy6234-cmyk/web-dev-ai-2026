<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>물고기 키우기</title>
    <link rel="stylesheet" href="./game 02-01.css" />
    <style>
      /* 플로팅 채팅 스타일 */
      #floating-chat-container {
        position: fixed;
        bottom: 150px; /* 하단에서 적당히 띄움 */
        left: 50%;
        transform: translateX(-50%);
        width: auto;
        max-width: 90%;
        pointer-events: none; /* 클릭 통과 (게임 조작 방해 안 함) */
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .floating-msg {
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 1rem;
        text-shadow: 1px 1px 2px black;
        animation: floatFade 4s forwards; /* 4초간 애니메이션 */
      }
      @keyframes floatFade {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        10% {
          opacity: 1;
          transform: translateY(0);
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(-30px);
        }
      }

      /* 대기실 설정 토글 스타일 */
      #waiting-room-settings-wrapper {
        width: 100%;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        margin: 15px 0;
        border: 1px solid rgba(255, 255, 255, 0.2);
        overflow: hidden; /* for smooth transition */
        transition: all 0.3s;
      }
      .settings-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 15px;
        cursor: pointer;
      }
      .settings-header h3 {
        margin: 0;
        font-size: 1.1rem;
        color: #ffeb3b;
      }
      #toggle-settings-btn {
        background: none;
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
        transition: transform 0.3s ease;
      }
      #toggle-settings-btn.open {
        transform: rotate(90deg);
      }
      #settings-details-content {
        padding: 0 15px;
        max-height: 0;
        opacity: 0;
        transition:
          max-height 0.4s ease-out,
          opacity 0.4s ease-out,
          padding 0.4s ease-out;
      }
      #settings-details-content.open {
        padding: 15px;
        max-height: 300px; /* A large enough value */
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="start-screen">
      <h1>물고기 키우기</h1>
      <div class="button-group">
        <button id="single-player-btn">혼자하기 (오프라인)</button>
        <button id="multi-player-btn">다인으로 하기</button>
        <button id="char-select-btn">캐릭터 선택</button>
        <button id="settings-btn">설정</button>
      </div>
    </div>
    <canvas id="game-canvas" class="hidden"></canvas>
    <div id="ui-layer" class="hidden">
      <div id="score">Score: 0</div>
      <button id="pause-btn">⏸️ 일시정지</button>
      <button id="home-btn">🏠 홈</button>
      <div id="game-over" class="hidden">
        <h1>Game Over</h1>
        <p>최종 점수: <span id="final-score">0</span></p>
        <button id="restart-btn">다시 시작</button>
      </div>
      <!-- 이모지 선택 바 (멀티플레이 전용) -->
      <div id="emoji-bar" style="display: none">
        <button class="emoji-btn">😀</button>
        <button class="emoji-btn">😂</button>
        <button class="emoji-btn">😡</button>
        <button class="emoji-btn">👍</button>
      </div>
      <!-- 실시간 순위표 (멀티플레이 전용) -->
      <div id="leaderboard" style="display: none"></div>
    </div>
    <!-- 설정 모달 -->
    <div id="settings-modal">
      <div class="modal-content">
        <h2>설정</h2>
        <div class="setting-item">
          <label for="difficulty-select">난이도</label>
          <select id="difficulty-select">
            <option value="easy">쉬움</option>
            <option value="normal" selected>보통</option>
            <option value="hard">어려움</option>
          </select>
        </div>
        <div class="setting-item">
          <label for="sound-toggle">소리</label>
          <input type="checkbox" id="sound-toggle" checked />
        </div>
        <button id="close-settings-btn">닫기</button>
      </div>
    </div>
    <!-- 캐릭터 선택 모달 -->
    <div id="char-select-modal">
      <div class="modal-content">
        <h2>캐릭터 선택</h2>
        <div class="char-grid">
          <div class="char-option selected" data-char="fish-1">
            <img src="./fish-1.png" alt="기본 물고기" width="60" />
          </div>
          <div class="char-option" data-char="fish-2">
            <img src="./fish-2.png" alt="적 물고기" width="60" />
          </div>
        </div>
        <button id="close-char-btn">닫기</button>
      </div>
    </div>
    <!-- 멀티플레이 모드 선택 모달 -->
    <div id="multiplayer-modal">
      <div class="modal-content">
        <h2>다인 모드</h2>
        <div class="multiplayer-options">
          <input
            type="text"
            id="multi-nickname-input"
            placeholder="닉네임 (선택사항)"
            maxlength="10"
            style="
              padding: 10px;
              border-radius: 5px;
              border: 1px solid #ccc;
              width: 100%;
              box-sizing: border-box;
            "
          />
          <button id="create-room-btn">방 만들기 (호스트)</button>
          <div class="join-room-section">
            <input type="text" id="room-id-input" placeholder="방 ID 입력" />
            <button id="join-room-btn">참여하기</button>
          </div>
        </div>
        <button id="close-multiplayer-btn">닫기</button>
      </div>
    </div>
    <!-- 대기실 모달 -->
    <div id="waiting-room-modal">
      <div class="modal-content">
        <h2>대기실</h2>
        <p>
          방 ID:
          <span
            id="waiting-room-id"
            style="font-weight: bold; color: #4caf50"
          ></span>
          <button id="copy-room-id-btn" title="방 ID 복사">📋</button>
        </p>

        <!-- 통합 설정 컨테이너 -->
        <div id="waiting-room-settings-wrapper">
          <div class="settings-header">
            <h3>🛠️ 방 설정</h3>
            <button id="toggle-settings-btn" title="설정 열기/닫기">⚙️</button>
          </div>
          <div id="settings-details-content">
            <!-- 채팅 색상 설정 -->
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
              "
            >
              <label for="chat-color-input">내 채팅 색상:</label>
              <input
                type="color"
                id="chat-color-input"
                value="#81D4FA"
                title="채팅 색상 선택"
                style="
                  width: 40px;
                  height: 40px;
                  border: none;
                  cursor: pointer;
                  background: transparent;
                "
              />
            </div>
            <!-- 호스트 설정 섹션 -->
            <div
              id="host-settings-container"
              style="
                padding-top: 15px;
                border-top: 1px solid rgba(255, 255, 255, 0.2);
                margin-top: 15px;
              "
            >
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                "
              >
                <label for="host-difficulty" style="color: white"
                  >난이도 (적 생성 속도):</label
                >
                <select
                  id="host-difficulty"
                  style="
                    padding: 5px;
                    border-radius: 4px;
                    background: #333;
                    color: white;
                    border: 1px solid #555;
                  "
                >
                  <option value="easy">쉬움</option>
                  <option value="normal" selected>보통</option>
                  <option value="hard">어려움</option>
                </select>
              </div>
              <p
                style="
                  font-size: 0.8rem;
                  color: #aaa;
                  text-align: right;
                  margin: 5px 0 0 0;
                "
              >
                (호스트 전용)
              </p>
            </div>
          </div>
        </div>

        <div
          id="player-list"
          style="
            margin: 20px 0;
            min-height: 100px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 5px;
          "
        ></div>
        <button
          id="start-game-btn"
          style="display: none; background-color: #ff5722"
        >
          게임 시작
        </button>
        <button
          id="ready-btn"
          style="
            display: none;
            background-color: #4caf50;
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
          "
        >
          준비 완료
        </button>
        <p id="waiting-message" style="font-size: 0.9rem; color: #ccc">
          호스트가 게임을 시작하기를 기다리고 있습니다...
        </p>
        <button
          id="leave-room-btn"
          style="margin-top: 10px; background-color: #555"
        >
          나가기
        </button>
      </div>
    </div>
    <!-- 멀티플레이 결과 모달 -->
    <div id="multi-results-modal" style="display: none">
      <div class="modal-content">
        <h2>게임 결과</h2>
        <div id="results-list" style="text-align: left; margin: 20px 0"></div>
        <div class="results-buttons">
          <button id="retry-game-btn">다시하기</button>
          <button id="leave-game-btn">나가기</button>
        </div>
      </div>
    </div>
    <!-- 카운트다운 오버레이 -->
    <div id="countdown-overlay" style="display: none">
      <div id="countdown-number"></div>
    </div>
    <!-- 플로팅 채팅 컨테이너 -->
    <div id="floating-chat-container"></div>
    <!-- 채팅창 (멀티플레이 전용) -->
    <div id="chat-container" style="display: none">
      <div id="chat-messages"></div>
      <div id="chat-input-wrapper">
        <input
          type="text"
          id="chat-input"
          placeholder="메시지 입력 (Enter)"
          maxlength="30"
        />
        <button id="chat-send-btn">전송</button>
      </div>
    </div>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="./game 02-styles.js"></script>
    <script src="./game 02-01.js"></script>
    <script src="./game 02-multi-main.js"></script>
    <script src="./game 02-multi-lobby.js"></script>
    <script src="./game 02-multi-waiting-room.js"></script>
    <script src="./game 02-multi-host.js"></script>
    <script src="./game 02-multi-chat.js"></script>
  </body>
</html>
